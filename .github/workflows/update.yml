name: Update data
on:
  schedule:
    - cron: '41 6 * * 4,5'   # Thu + Fri (EIA heating fuel and gasoline data come out Wed/Mon)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./fetch.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push
